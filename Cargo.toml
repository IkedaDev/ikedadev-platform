[workspace]
resolver = "2"
members = [
    "crates/ikeda-core",
    "services/events-api",
    "services/crm-api",
    "services/identity-api",
    "services/catalog-api",
    "services/bookings-api",
    "services/telemetry-api",
    "services/content-api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["IkedaDev Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Async Runtime & Web Framework
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
http = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "timeout", "request-id"] }
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }

# OpenAPI Specification
utoipa = { version = "5.3", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9.0", features = ["axum"] }

# Database & Migrations
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }

# Recurrence Rule (RFC 5545)
rrule = { version = "0.14", features = ["serde"] }

# Cryptography & Hashing
sha2 = "0.10"
hex = "0.4"
jsonwebtoken = "9"

# Serialization & Data Formats
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.15", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }

# Configuration & Env
dotenvy = "0.15"

# Error Handling & Validation
thiserror = "2.0"
validator = { version = "0.20", features = ["derive"] }

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Local Workspace Crates
ikeda-core = { path = "crates/ikeda-core" }
