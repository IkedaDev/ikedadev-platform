name: ikedadev-platform

services:
  # ============================================================================
  # 1. PostgreSQL Database (Multi-DB Auto-Init: events_db, crm_db, identity_db, catalog_db, bookings_db, telemetry_db)
  #    Always starts as base infrastructure:
  #      docker compose up -d                         -> postgres only
  #      docker compose --profile keycloak up -d      -> postgres + keycloak
  #      docker compose --profile apis up -d          -> postgres + 6 Rust APIs
  #      docker compose --profile observability up -d -> postgres + loki + promtail + grafana
  #      docker compose --profile full up -d          -> postgres + keycloak + 6 Rust APIs
  # ============================================================================
  postgres:
    image: postgres:17-alpine
    container_name: ikedadev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: events_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      IKEDA_APP_USER: "${IKEDA_APP_USER:-ikeda_app}"
      IKEDA_APP_PASSWORD: "${IKEDA_APP_PASSWORD:-ikeda_app_password}"
      LOCAL_DEV_API_KEY: "${LOCAL_DEV_API_KEY:-ik_live_dev_tenant_portal_local_2026}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/00_init_databases.sh:ro
      - ./services/events-api/migrations:/migrations/events:ro
      - ./services/crm-api/migrations:/migrations/crm:ro
      - ./services/identity-api/migrations:/migrations/identity:ro
      - ./services/catalog-api/migrations:/migrations/catalog:ro
      - ./services/bookings-api/migrations:/migrations/bookings:ro
      - ./services/telemetry-api/migrations:/migrations/telemetry:ro
      - ./services/content-api/migrations:/migrations/content:ro
      - ./services/media-api/migrations:/migrations/media:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d identity_db"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s

  # ============================================================================
  # 2. Events API (Rust Axum Microservice - Port 8080)
  #    Profiles: events | apis | full
  # ============================================================================
  events-api:
    container_name: ikedadev-events-api
    profiles: ["events", "apis", "full"]
    build:
      context: .
      dockerfile: services/events-api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      DATABASE_URL: "postgres://${IKEDA_APP_USER:-ikeda_app}:${IKEDA_APP_PASSWORD:-ikeda_app_password}@postgres:5432/events_db?sslmode=disable"
      IDENTITY_DATABASE_URL: "postgres://${IKEDA_APP_USER:-ikeda_app}:${IKEDA_APP_PASSWORD:-ikeda_app_password}@postgres:5432/identity_db?sslmode=disable"
      DATABASE_MAX_CONNECTIONS: "20"
      DATABASE_MIN_CONNECTIONS: "3"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
      RUST_LOG: "info,events_api=debug,tower_http=info"
      QSTASH_TOKEN: "mock-dev-token"
      JWKS_URI: "${JWKS_URI:-http://keycloak:8080/realms/ikeda/protocol/openid-connect/certs}"
      JWT_ISSUER: "${JWT_ISSUER:-http://localhost:8180/realms/ikeda}"
    ports:
      - "127.0.0.1:8080:8080"

  # ============================================================================
  # 3. CRM API (Rust Axum Microservice - Port 8081)
  #    Profiles: crm | apis | full
  # ============================================================================
  crm-api:
    container_name: ikedadev-crm-api
    profiles: ["crm", "apis", "full"]
    build:
      context: .
      dockerfile: services/crm-api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8081"
      HOST: "0.0.0.0"
      DATABASE_URL: "postgres://${IKEDA_APP_USER:-ikeda_app}:${IKEDA_APP_PASSWORD:-ikeda_app_password}@postgres:5432/crm_db?sslmode=disable"
      IDENTITY_DATABASE_URL: "postgres://${IKEDA_APP_USER:-ikeda_app}:${IKEDA_APP_PASSWORD:-ikeda_app_password}@postgres:5432/identity_db?sslmode=disable"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
      RUST_LOG: "info,crm_api=debug,tower_http=info"
      JWKS_URI: "${JWKS_URI:-http://keycloak:8080/realms/ikeda/protocol/openid-connect/certs}"
      JWT_ISSUER: "${JWT_ISSUER:-http://localhost:8180/realms/ikeda}"
    ports:
      - "127.0.0.1:8081:8081"

  # ============================================================================
  # 4. Identity API (Rust Axum Microservice - Port 8082)
  #    Profiles: identity | apis | full
  # ============================================================================
  identity-api:
    container_name: ikedadev-identity-api
    profiles: ["identity", "apis", "full"]
    build:
      context: .
      dockerfile: services/identity-api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8082"
      HOST: "0.0.0.0"
      DATABASE_URL: "postgres://${IKEDA_APP_USER:-ikeda_app}:${IKEDA_APP_PASSWORD:-ikeda_app_password}@postgres:5432/identity_db?sslmode=disable"
      KEYCLOAK_BASE_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: "${KEYCLOAK_REALM:-ikeda}"
      KEYCLOAK_CLIENT_ID: "${KEYCLOAK_CLIENT_ID:-identity-api-admin}"
      KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET:-ikeda-identity-admin-secret-2026}"
      JWKS_URI: "${JWKS_URI:-http://keycloak:8080/realms/ikeda/protocol/openid-connect/certs}"
      JWT_ISSUER: "${JWT_ISSUER:-http://localhost:8180/realms/ikeda}"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
      RUST_LOG: "info,identity_api=debug,tower_http=info"
    ports:
      - "127.0.0.1:8082:8082"

  # ============================================================================
  # 5. Catalog API (Rust Axum Microservice - Port 8083)
  #    Profiles: catalog | apis | full
  # ============================================================================
  catalog-api:
    container_name: ikedadev-catalog-api
    profiles: ["catalog", "apis", "full"]
    build:
      context: .
      dockerfile: services/catalog-api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8083"
      HOST: "0.0.0.0"
      DATABASE_URL: "postgres://${IKEDA_APP_USER:-ikeda_app}:${IKEDA_APP_PASSWORD:-ikeda_app_password}@postgres:5432/catalog_db?sslmode=disable"
      IDENTITY_DATABASE_URL: "postgres://${IKEDA_APP_USER:-ikeda_app}:${IKEDA_APP_PASSWORD:-ikeda_app_password}@postgres:5432/identity_db?sslmode=disable"
      JWKS_URI: "${JWKS_URI:-http://keycloak:8080/realms/ikeda/protocol/openid-connect/certs}"
      JWT_ISSUER: "${JWT_ISSUER:-http://localhost:8180/realms/ikeda}"
      ALLOW_INSECURE_HTTP_URLS: "${ALLOW_INSECURE_HTTP_URLS:-true}"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
      RUST_LOG: "info,catalog_api=debug,tower_http=info"
    ports:
      - "127.0.0.1:8083:8083"

  # ============================================================================
  # 6. Bookings API (Rust Axum Microservice - Port 8084)
  #    Profiles: bookings | apis | full
  # ============================================================================
  bookings-api:
    container_name: ikedadev-bookings-api
    profiles: ["bookings", "apis", "full"]
    build:
      context: .
      dockerfile: services/bookings-api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8084"
      HOST: "0.0.0.0"
      DATABASE_URL: "postgres://${IKEDA_APP_USER:-ikeda_app}:${IKEDA_APP_PASSWORD:-ikeda_app_password}@postgres:5432/bookings_db?sslmode=disable"
      IDENTITY_DATABASE_URL: "postgres://${IKEDA_APP_USER:-ikeda_app}:${IKEDA_APP_PASSWORD:-ikeda_app_password}@postgres:5432/identity_db?sslmode=disable"
      JWKS_URI: "${JWKS_URI:-http://keycloak:8080/realms/ikeda/protocol/openid-connect/certs}"
      JWT_ISSUER: "${JWT_ISSUER:-http://localhost:8180/realms/ikeda}"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
      RUST_LOG: "info,bookings_api=debug,tower_http=info"
    ports:
      - "127.0.0.1:8084:8084"

  # ============================================================================
  # 7. Telemetry API (Rust Axum Microservice - Port 8085)
  #    Profiles: telemetry | apis | full
  # ============================================================================
  telemetry-api:
    container_name: ikedadev-telemetry-api
    profiles: ["telemetry", "apis", "full"]
    build:
      context: .
      dockerfile: services/telemetry-api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8085"
      HOST: "0.0.0.0"
      DATABASE_URL: "postgres://${IKEDA_APP_USER:-ikeda_app}:${IKEDA_APP_PASSWORD:-ikeda_app_password}@postgres:5432/telemetry_db?sslmode=disable"
      IDENTITY_DATABASE_URL: "postgres://${IKEDA_APP_USER:-ikeda_app}:${IKEDA_APP_PASSWORD:-ikeda_app_password}@postgres:5432/identity_db?sslmode=disable"
      JWKS_URI: "${JWKS_URI:-http://keycloak:8080/realms/ikeda/protocol/openid-connect/certs}"
      JWT_ISSUER: "${JWT_ISSUER:-http://localhost:8180/realms/ikeda}"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
      RUST_LOG: "info,telemetry_api=debug,tower_http=info"
    ports:
      - "127.0.0.1:8085:8085"

  # ============================================================================
  # 8. Content API (Rust Axum Headless CMS Microservice - Port 8086)
  #    Profiles: content | apis | full
  # ============================================================================
  content-api:
    container_name: ikedadev-content-api
    profiles: ["content", "apis", "full"]
    build:
      context: .
      dockerfile: services/content-api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8086"
      HOST: "0.0.0.0"
      DATABASE_URL: "postgres://${IKEDA_APP_USER:-ikeda_app}:${IKEDA_APP_PASSWORD:-ikeda_app_password}@postgres:5432/content_db?sslmode=disable"
      IDENTITY_DATABASE_URL: "postgres://${IKEDA_APP_USER:-ikeda_app}:${IKEDA_APP_PASSWORD:-ikeda_app_password}@postgres:5432/identity_db?sslmode=disable"
      JWKS_URI: "${JWKS_URI:-http://keycloak:8080/realms/ikeda/protocol/openid-connect/certs}"
      JWT_ISSUER: "${JWT_ISSUER:-http://localhost:8180/realms/ikeda}"
      PREVIEW_TOKEN_SECRET: "${PREVIEW_TOKEN_SECRET:-dev-preview-token-secret-change-in-production}"
      ALLOW_INSECURE_HTTP_URLS: "${ALLOW_INSECURE_HTTP_URLS:-true}"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
      RUST_LOG: "info,content_api=debug,tower_http=info"
    ports:
      - "127.0.0.1:8086:8086"

  # ============================================================================
  # 9. Media API (Rust Axum Transversal Media Service - Port 8087)
  #    Profiles: media | apis | full
  # ============================================================================
  media-api:
    container_name: ikedadev-media-api
    profiles: ["media", "apis", "full"]
    build:
      context: .
      dockerfile: services/media-api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8087"
      HOST: "0.0.0.0"
      DATABASE_URL: "postgres://${IKEDA_APP_USER:-ikeda_app}:${IKEDA_APP_PASSWORD:-ikeda_app_password}@postgres:5432/media_db?sslmode=disable"
      IDENTITY_DATABASE_URL: "postgres://${IKEDA_APP_USER:-ikeda_app}:${IKEDA_APP_PASSWORD:-ikeda_app_password}@postgres:5432/identity_db?sslmode=disable"
      JWKS_URI: "${JWKS_URI:-http://keycloak:8080/realms/ikeda/protocol/openid-connect/certs}"
      JWT_ISSUER: "${JWT_ISSUER:-http://localhost:8180/realms/ikeda}"
      ALLOW_LOCAL_MEDIA_STORAGE: "${ALLOW_LOCAL_MEDIA_STORAGE:-true}"
      LOCAL_MEDIA_BASE_URL: "${LOCAL_MEDIA_BASE_URL:-http://localhost:8087/v1/media/local}"
      LOCAL_MEDIA_DIR: "/tmp/ikeda-media-local"
      LOCAL_MEDIA_SIGNING_SECRET: "${LOCAL_MEDIA_SIGNING_SECRET:-dev-local-media-hmac-secret-change-me}"
      LOCAL_CORS_ORIGIN: "${LOCAL_CORS_ORIGIN:-http://localhost:5173}"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
      RUST_LOG: "info,media_api=debug,tower_http=info"
    ports:
      - "127.0.0.1:8087:8087"

  # ============================================================================
  # 8. Keycloak Dev Server with Auto-Imported `ikeda` Realm (Port 8180)
  #    Start with: docker compose --profile keycloak up -d
  # ============================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: ikedadev-keycloak
    profiles: ["keycloak", "full"]
    command: start-dev --import-realm
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_dev_password
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: "http://localhost:8180"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./deploy/keycloak/ikeda-realm.json:/opt/keycloak/data/import/ikeda-realm.json:ro

  # ============================================================================
  # 9. Local Observability Stack (Loki + Promtail + Grafana)
  #    Start with: docker compose --profile observability up -d
  # ============================================================================
  loki:
    image: grafana/loki:3.1.1
    container_name: ikedadev-loki
    profiles: ["observability"]
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./deploy/observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

  promtail:
    image: grafana/promtail:3.1.1
    container_name: ikedadev-promtail
    profiles: ["observability"]
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    depends_on:
      - loki
    volumes:
      - ./deploy/observability/promtail-config.yaml:/etc/promtail/config.yml:ro
      # SECURITY NOTE (local dev only): Mounting docker.sock grants Docker API access even with :ro.
      # In production / K3s clusters, scrape /var/log/containers/*.log or use a read-only socket proxy.
      - /var/run/docker.sock:/var/run/docker.sock:ro

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ikedadev-grafana
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      - loki
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      # Default to Viewer for least privilege; override with GF_AUTH_ANONYMOUS_ORG_ROLE=Admin locally if needed.
      GF_AUTH_ANONYMOUS_ORG_ROLE: "${GF_AUTH_ANONYMOUS_ORG_ROLE:-Viewer}"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deploy/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local
