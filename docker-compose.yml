name: ikedadev-platform

services:
  # ============================================================================
  # 1. PostgreSQL Database with Auto-Migration & Row-Level Security (RLS)
  # ============================================================================
  postgres:
    image: postgres:17-alpine
    container_name: ikedadev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: events_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Ejecuta automáticamente la migración SQL al iniciar por primera vez
      - ./services/events-api/migrations/20261123000001_create_events_schema.sql:/docker-entrypoint-initdb.d/01_create_events_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d events_db"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

  # ============================================================================
  # 2. Events API (Rust Axum Microservice)
  # ============================================================================
  events-api:
    container_name: ikedadev-events-api
    build:
      context: .
      dockerfile: services/events-api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      DATABASE_URL: "postgres://postgres:postgres_password@postgres:5432/events_db?sslmode=disable"
      DATABASE_MAX_CONNECTIONS: "20"
      DATABASE_MIN_CONNECTIONS: "3"
      RUST_LOG: "info,events_api=debug,tower_http=info"
      QSTASH_TOKEN: "mock-dev-token"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
    driver: local
