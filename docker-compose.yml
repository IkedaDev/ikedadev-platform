name: ikedadev-platform

services:
  # ============================================================================
  # 1. PostgreSQL Database (Multi-DB Auto-Init: events_db, crm_db, identity_db, catalog_db)
  #    Always starts as base infrastructure:
  #      docker compose up -d                    -> postgres only
  #      docker compose --profile keycloak up -d -> postgres + keycloak
  #      docker compose --profile apis up -d     -> postgres + 4 Rust APIs
  #      docker compose --profile full up -d     -> postgres + keycloak + 4 Rust APIs
  # ============================================================================
  postgres:
    image: postgres:17-alpine
    container_name: ikedadev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: events_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      LOCAL_DEV_API_KEY: "${LOCAL_DEV_API_KEY:-ik_live_dev_tenant_portal_local_2026}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/00_init_databases.sh:ro
      - ./services/events-api/migrations:/migrations/events:ro
      - ./services/crm-api/migrations:/migrations/crm:ro
      - ./services/identity-api/migrations:/migrations/identity:ro
      - ./services/catalog-api/migrations:/migrations/catalog:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d identity_db"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s

  # ============================================================================
  # 2. Events API (Rust Axum Microservice - Port 8080)
  #    Profiles: events | apis | full
  # ============================================================================
  events-api:
    container_name: ikedadev-events-api
    profiles: ["events", "apis", "full"]
    build:
      context: .
      dockerfile: services/events-api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      DATABASE_URL: "postgres://postgres:postgres_password@postgres:5432/events_db?sslmode=disable"
      IDENTITY_DATABASE_URL: "postgres://postgres:postgres_password@postgres:5432/identity_db?sslmode=disable"
      DATABASE_MAX_CONNECTIONS: "20"
      DATABASE_MIN_CONNECTIONS: "3"
      RUST_LOG: "info,events_api=debug,tower_http=info"
      QSTASH_TOKEN: "mock-dev-token"
      JWKS_URI: "${JWKS_URI:-http://keycloak:8080/realms/ikeda/protocol/openid-connect/certs}"
      JWT_ISSUER: "${JWT_ISSUER:-http://localhost:8180/realms/ikeda}"
    ports:
      - "8080:8080"

  # ============================================================================
  # 3. CRM API (Rust Axum Microservice - Port 8081)
  #    Profiles: crm | apis | full
  # ============================================================================
  crm-api:
    container_name: ikedadev-crm-api
    profiles: ["crm", "apis", "full"]
    build:
      context: .
      dockerfile: services/crm-api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8081"
      HOST: "0.0.0.0"
      DATABASE_URL: "postgres://postgres:postgres_password@postgres:5432/crm_db?sslmode=disable"
      IDENTITY_DATABASE_URL: "postgres://postgres:postgres_password@postgres:5432/identity_db?sslmode=disable"
      RUST_LOG: "info,crm_api=debug,tower_http=info"
      JWKS_URI: "${JWKS_URI:-http://keycloak:8080/realms/ikeda/protocol/openid-connect/certs}"
      JWT_ISSUER: "${JWT_ISSUER:-http://localhost:8180/realms/ikeda}"
    ports:
      - "8081:8081"

  # ============================================================================
  # 4. Identity API (Rust Axum Microservice - Port 8082)
  #    Profiles: identity | apis | full
  # ============================================================================
  identity-api:
    container_name: ikedadev-identity-api
    profiles: ["identity", "apis", "full"]
    build:
      context: .
      dockerfile: services/identity-api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8082"
      HOST: "0.0.0.0"
      DATABASE_URL: "postgres://postgres:postgres_password@postgres:5432/identity_db?sslmode=disable"
      KEYCLOAK_BASE_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: "${KEYCLOAK_REALM:-ikeda}"
      KEYCLOAK_CLIENT_ID: "${KEYCLOAK_CLIENT_ID:-identity-api-admin}"
      KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET:-ikeda-identity-admin-secret-2026}"
      JWKS_URI: "${JWKS_URI:-http://keycloak:8080/realms/ikeda/protocol/openid-connect/certs}"
      JWT_ISSUER: "${JWT_ISSUER:-http://localhost:8180/realms/ikeda}"
      RUST_LOG: "info,identity_api=debug,tower_http=info"
    ports:
      - "8082:8082"

  # ============================================================================
  # 5. Catalog API (Rust Axum Microservice - Port 8083)
  #    Profiles: catalog | apis | full
  # ============================================================================
  catalog-api:
    container_name: ikedadev-catalog-api
    profiles: ["catalog", "apis", "full"]
    build:
      context: .
      dockerfile: services/catalog-api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8083"
      HOST: "0.0.0.0"
      DATABASE_URL: "postgres://postgres:postgres_password@postgres:5432/catalog_db?sslmode=disable"
      IDENTITY_DATABASE_URL: "postgres://postgres:postgres_password@postgres:5432/identity_db?sslmode=disable"
      JWKS_URI: "${JWKS_URI:-http://keycloak:8080/realms/ikeda/protocol/openid-connect/certs}"
      JWT_ISSUER: "${JWT_ISSUER:-http://localhost:8180/realms/ikeda}"
      RUST_LOG: "info,catalog_api=debug,tower_http=info"
    ports:
      - "8083:8083"

  # ============================================================================
  # 6. Keycloak Dev Server with Auto-Imported `ikeda` Realm (Port 8180)
  #    Start with: docker compose --profile keycloak up -d
  # ============================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: ikedadev-keycloak
    profiles: ["keycloak", "full"]
    command: start-dev --import-realm
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_dev_password
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: "http://localhost:8180"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8180:8080"
    volumes:
      - ./deploy/keycloak/ikeda-realm.json:/opt/keycloak/data/import/ikeda-realm.json:ro

volumes:
  postgres_data:
    driver: local
