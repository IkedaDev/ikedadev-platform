name: Deploy CRM API

on:
  push:
    branches: [main, develop]
    paths:
      - "services/crm-api/**"
      - "crates/ikeda-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/crm-api.yml"
  workflow_dispatch:

env:
  SERVICE_NAME: crm-api

jobs:
  build-and-deploy:
    name: Build & Deploy crm-api (Cloud Run)
    if: ${{ vars.GCP_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'qa' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Compute Short SHA, Environment & Artifact Registry URI
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            ENV_PREFIX="prod"
          else
            ENV_PREFIX="qa"
          fi
          REGION="${{ vars.GCP_REGION || 'us-central1' }}"
          AR_REPO="${{ vars.GCP_AR_REPO || 'ikeda-platform' }}"
          PROJECT_ID="${{ vars.GCP_PROJECT_ID }}"
          IMAGE_TAG="${ENV_PREFIX}-${SHORT_SHA}"
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${SERVICE_NAME}:${IMAGE_TAG}"
          CLOUD_RUN_SERVICE="${SERVICE_NAME}-${ENV_PREFIX}"
          echo "env_prefix=${ENV_PREFIX}" >> "$GITHUB_OUTPUT"
          echo "region=${REGION}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "cloud_run_service=${CLOUD_RUN_SERVICE}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ steps.meta.outputs.region }}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push linux/amd64 Image (cargo-chef + GHA cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/crm-api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image_uri }}
          cache-from: type=gha,scope=crm-api
          cache-to: type=gha,mode=max,scope=crm-api

      - name: Deploy Private Service to Cloud Run
        env:
          DATABASE_URL: ${{ secrets.CRM_DATABASE_URL }}
          IDENTITY_DATABASE_URL: ${{ secrets.IDENTITY_READER_DATABASE_URL }}
          JWKS_URI: ${{ vars.JWKS_URI }}
          JWT_ISSUER: ${{ vars.JWT_ISSUER }}
        run: |
          ENV_VARS="RUST_LOG=info,sqlx=warn"
          [ -n "${DATABASE_URL}" ] && ENV_VARS="${ENV_VARS},DATABASE_URL=${DATABASE_URL}"
          [ -n "${IDENTITY_DATABASE_URL}" ] && ENV_VARS="${ENV_VARS},IDENTITY_DATABASE_URL=${IDENTITY_DATABASE_URL}"
          [ -n "${JWKS_URI}" ] && ENV_VARS="${ENV_VARS},JWKS_URI=${JWKS_URI}"
          [ -n "${JWT_ISSUER}" ] && ENV_VARS="${ENV_VARS},JWT_ISSUER=${JWT_ISSUER}"

          gcloud run deploy "${{ steps.meta.outputs.cloud_run_service }}" \
            --image="${{ steps.meta.outputs.image_uri }}" \
            --region="${{ steps.meta.outputs.region }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --service-account="platform-api-runtime@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --no-allow-unauthenticated \
            --min-instances=0 \
            --max-instances=1 \
            --cpu=1 \
            --memory=256Mi \
            --cpu-throttling \
            --concurrency=80 \
            --timeout=15s \
            --set-env-vars="${ENV_VARS}"
