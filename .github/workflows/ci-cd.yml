name: Universal CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/events-api

jobs:
  # ============================================================================
  # 1. Quality Gate (Rust Standard CI)
  # ============================================================================
  quality-gate:
    name: Code Quality & Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Strict Code Formatting Check
        run: cargo fmt --all -- --check

      - name: Strict Clippy Linting (-D warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Unit & Integration Test Suite
        run: cargo test --workspace

  # ============================================================================
  # 2. Container Build & Push (Agnostic OCI Image to GitHub Packages)
  # ============================================================================
  build-container:
    name: Build OCI Image (Multi-Arch)
    needs: quality-gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU (for ARM64 / K3s compilation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/events-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 3. Modular Deployment Target (Cloud Run hoy, K8s / ArgoCD mañana)
  # ============================================================================
  deploy:
    name: Continuous Deployment
    needs: build-container
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Manifests
        uses: actions/checkout@v4

      # ------------------------------------------------------------------------
      # OPCIÓN A: Despliegue en Google Cloud Run (Si existen credenciales GCP)
      # ------------------------------------------------------------------------
      - name: Google Cloud Authentication (Optional / Cloud Run)
        if: env.GCP_PROJECT_ID != ''
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        if: env.GCP_PROJECT_ID != ''
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: events-api
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          region: us-central1
          flags: "--allow-unauthenticated --port=8080"
          env_vars: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            QSTASH_TOKEN=${{ secrets.QSTASH_TOKEN }}

      # ------------------------------------------------------------------------
      # OPCIÓN B: GitOps / Kubernetes / ArgoCD Sync
      # Actualiza el tag inmutable de Kustomize para que ArgoCD o K3s reconcilien
      # ------------------------------------------------------------------------
      - name: Update Kustomize Image Tag (GitOps / ArgoCD)
        run: |
          cd deploy/k8s/base
          sed -i "s|newTag:.*|newTag: sha-${{ github.sha }}|g" kustomization.yaml
          echo "Kustomize manifest updated with image sha-${{ github.sha }}"
