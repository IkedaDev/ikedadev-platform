name: Deploy Identity API

on:
  push:
    branches: [main, develop]
    paths:
      - "services/identity-api/**"
      - "crates/ikeda-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/identity-api.yml"

env:
  SERVICE_NAME: identity-api
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push identity-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Compute Short SHA and Image Tag
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            ENV_PREFIX="prod"
          else
            ENV_PREFIX="qa"
          fi
          IMAGE_TAG="${ENV_PREFIX}-${SHORT_SHA}"
          IMAGE_URI="${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/${SERVICE_NAME}:${IMAGE_TAG}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "env_prefix=${ENV_PREFIX}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image (cargo-chef + GHA cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/identity-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image_uri }}
          cache-from: type=gha,scope=identity-api
          cache-to: type=gha,mode=max,scope=identity-api

      # ========================================================================
      # Optional: Deploy to Google Cloud Run (enable once GCP secrets are added)
      # Required secrets: GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT,
      #                   GCP_PROJECT_ID, GCP_REGION
      # ========================================================================
      # - name: Authenticate to Google Cloud
      #   if: ${{ secrets.GCP_PROJECT_ID != '' }}
      #   uses: google-github-actions/auth@v2
      #   with:
      #     workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      #     service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      #
      # - name: Deploy to Google Cloud Run
      #   if: ${{ secrets.GCP_PROJECT_ID != '' }}
      #   uses: google-github-actions/deploy-cloudrun@v2
      #   with:
      #     service: ${{ env.SERVICE_NAME }}-${{ steps.meta.outputs.env_prefix }}
      #     region: ${{ secrets.GCP_REGION }}
      #     image: ${{ steps.meta.outputs.image_uri }}
