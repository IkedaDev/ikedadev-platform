name: Workspace CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Rust Format, Clippy & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Strict Formatting Check
        run: cargo fmt --all -- --check

      - name: Strict Clippy Check (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Workspace Unit Tests
        run: cargo test --workspace --lib

  portal-bff:
    name: Portal BFF Typecheck & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal/bff
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/bff/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run BFF Security & Unit Tests
        run: npm test

  portal-web:
    name: Portal Web Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal/web
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Production Build
        run: npm run build
