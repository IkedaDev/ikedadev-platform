server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: ikedadev-docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["ikedadev-.*"]
    relabel_configs:
      # Scrape only ikedadev-* containers
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(ikedadev-.*)"
        action: keep
      # Default low-cardinality service label from container name (ikedadev-<service>)
      - source_labels: ["__meta_docker_container_name"]
        regex: "/ikedadev-(.*)"
        target_label: "service"
      # Prefer Docker Compose service label when present
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        regex: "(.+)"
        target_label: "service"
    pipeline_stages:
      # Unwrap Docker JSON log envelope
      - docker: {}
      # Parse structured JSON logs emitted by ikeda-core (LOG_FORMAT=json).
      # ONLY extract low-cardinality fields (service, level) as Loki labels.
      # High-cardinality fields (request_id, tenant_id, user_id, path, etc.) stay
      # in the JSON log body and are filtered at query time with LogQL `| json`.
      - json:
          expressions:
            level: level
            service: service
      - labels:
          level:
          service:
