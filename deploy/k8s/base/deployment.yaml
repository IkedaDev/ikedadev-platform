apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-api
  labels:
    app.kubernetes.io/name: events-api
    app.kubernetes.io/part-of: ikedadev-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: events-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: events-api
    spec:
      containers:
        - name: events-api
          image: ghcr.io/ikedadev/events-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: events-api-config
            - secretRef:
                name: events-api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
